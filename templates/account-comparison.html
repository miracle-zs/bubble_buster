<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#080a0f" />
  <title>账户权益对比 · Bubble Buster</title>
  <link rel="icon" type="image/svg+xml" href="../../static/favicon.svg" />
  <link rel="preload" as="script" href="../../static/vendor/echarts.min.js" />
  <link rel="stylesheet" href="../../static/ops.css" />
  <link rel="stylesheet" href="../../static/comparison.css" />
</head>
<body>
__OPS_TOPBAR__

  <main id="main-content" class="ops-shell">
    <section class="hero">
      <div>
        <div class="hero-title-row">
          <h1>多账户权益走势同轴对比</h1>
          <div id="freshness-pill" class="ops-freshness is-warn">
            <span class="ops-freshness-dot" aria-hidden="true"></span>
            <span id="status-text">正在读取快照</span>
          </div>
        </div>
      </div>
      <div class="controls" aria-label="图表筛选">
        <div id="range-controls" class="control-group ops-segmented" role="group" aria-label="时间范围">
          <button class="control ops-seg-btn" data-range="24" type="button" aria-pressed="false">24 小时</button>
          <button class="control ops-seg-btn" data-range="72" type="button" aria-pressed="false">3 天</button>
          <button class="control ops-seg-btn" data-range="168" type="button" aria-pressed="false">7 天</button>
          <button class="control ops-seg-btn" data-range="720" type="button" aria-pressed="false">30 天</button>
          <button class="control ops-seg-btn active" data-range="all" type="button" aria-pressed="true">上线以来</button>
        </div>
        <div id="mode-controls" class="control-group ops-segmented" role="group" aria-label="图表模式">
          <button class="control ops-seg-btn active" data-mode="relative" type="button" aria-pressed="true">相对变化</button>
          <button class="control ops-seg-btn" data-mode="absolute" type="button" aria-pressed="false">账户权益</button>
        </div>
        <button id="refresh-button" class="ops-btn control refresh" type="button" aria-label="手动刷新账户权益对比">
          <svg class="ops-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.4-3.7"/><path d="M13.5 2.5v3h-3"/></svg>
          <span class="btn-label">刷新</span>
        </button>
      </div>
    </section>

    <div id="notice" class="ops-alert comparison-alert" role="alert" hidden>
      <span id="notice-text" class="ops-alert-copy"></span>
      <div class="ops-alert-actions">
        <button id="notice-retry-btn" class="ops-btn" type="button">立即重试</button>
      </div>
    </div>

    <section id="summary-grid" class="summary-grid" aria-label="账户摘要"></section>

    <section class="chart-panel" aria-labelledby="chart-title">
      <div class="chart-head">
        <div>
          <h2 id="chart-title" class="chart-title">相对权益变化（%）</h2>
          <p id="chart-subtitle" class="chart-subtitle">组合止盈上线后首个有效快照 = 0%；策略事件不叠加到主图。</p>
        </div>
        <div class="chart-head-right">
          <button id="reset-zoom-button" class="ops-btn" type="button" hidden>重置缩放</button>
          <div id="chart-meta" class="chart-meta">--</div>
        </div>
      </div>
      <div id="equity-chart" role="img" aria-label="多账户权益对比曲线"></div>
      <div id="chart-empty" class="chart-empty">
        <span id="chart-empty-text">当前窗口没有可用权益快照</span>
        <button id="chart-empty-action" class="ops-btn" type="button" hidden>切换至上线以来</button>
      </div>
      <div id="legend" class="legend" aria-label="账户图例"></div>
    </section>

    <section class="metrics-panel" aria-labelledby="metrics-table-title">
      <div class="metrics-panel-head">
        <div>
          <h2 id="metrics-table-title" class="metrics-panel-title">区间指标与策略差异对比</h2>
        </div>
      </div>
      <div id="metrics-sort-status" class="sr-only" role="status" aria-live="polite"></div>
      <div class="table-wrap" tabindex="0" role="region" aria-labelledby="metrics-table-title">
        <table id="comparison-metrics-table" class="comparison-table">
          <caption class="sr-only">各账户区间收益、当前权益、最大回撤与策略差异对比表</caption>
          <thead>
            <tr>
              <th scope="col"><button class="sort-btn" type="button" data-sort-key="account_id">账户<span class="sort-indicator" aria-hidden="true"></span></button></th>
              <th scope="col" class="numeric" aria-sort="descending"><button class="sort-btn" type="button" data-sort-key="change_pct">区间收益率<span class="sort-indicator" aria-hidden="true"></span></button></th>
              <th scope="col" class="numeric"><button class="sort-btn" type="button" data-sort-key="latest_equity">当前权益 (USDT)<span class="sort-indicator" aria-hidden="true"></span></button></th>
              <th scope="col" class="numeric"><button class="sort-btn" type="button" data-sort-key="max_drawdown_pct">区间最大回撤<span class="sort-indicator" aria-hidden="true"></span></button></th>
              <th scope="col" class="numeric">区间低点 / 高点</th>
              <th scope="col">策略差异</th>
            </tr>
          </thead>
          <tbody id="comparison-metrics-body">
            <tr><td colspan="6" class="table-empty-cell">加载中...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <div class="footnote">
      <span>数据来源：<strong>账户权益快照</strong></span>
      <span id="data-as-of">数据截至 --</span>
    </div>
  </main>

  <script id="page-config" type="application/json">__PAGE_CONFIG_JSON__</script>
  <script defer src="../../static/ops.js"></script>
  <script defer src="../../static/comparison.js"></script>
</body>
</html>
