<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0d1117" />
  <title>账户权益对比 · Bubble Buster</title>
  <link rel="stylesheet" href="../../static/ops.css?v=2" />
  <style>
    .page {
      width: 100%;
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 12px 16px 32px;
    }
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 16px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      margin-bottom: 12px;
    }
    .hero-title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px 14px;
    }
    h1 {
      margin: 0;
      color: var(--text);
      font-size: var(--text-lg);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }
    .topline-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 3px 9px;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      background: var(--surface-subtle);
      color: var(--text-secondary);
      font-size: var(--text-xs);
      font-weight: 600;
      white-space: nowrap;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ok);
      flex-shrink: 0;
    }
    .status-dot.is-loading { background: var(--warn); }
    .status-dot.is-error { background: var(--bad); }
    .hero-copy {
      max-width: 760px;
      margin: 6px 0 0;
      color: var(--muted);
      font-size: var(--text-sm);
      line-height: 1.5;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }
    .control-group {
      display: inline-flex;
      gap: 2px;
      padding: 2px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-inset);
    }
    .control {
      appearance: none;
      min-height: 32px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      padding: 5px 10px;
      color: var(--text-secondary);
      background: transparent;
      cursor: pointer;
      font-size: var(--text-xs);
      font-weight: 600;
      transition: color 120ms ease, background 120ms ease, border-color 120ms ease;
    }
    .control:hover {
      color: var(--text);
      background: var(--surface-hover);
    }
    .control.active {
      color: var(--text);
      background: var(--accent-bg);
      border-color: var(--accent-border);
    }
    .control.refresh {
      border: 1px solid var(--border);
      color: var(--text-secondary);
      background: var(--surface-subtle);
      border-radius: var(--radius);
    }
    .control.refresh:hover {
      color: var(--text);
      border-color: var(--accent);
      background: var(--surface-hover);
    }
    .notice {
      display: none;
      margin: 0 0 12px;
      padding: 10px 14px;
      border: 1px solid var(--bad-border);
      border-radius: var(--radius);
      color: var(--bad-text);
      background: var(--bad-bg);
      font-size: var(--text-sm);
      line-height: 1.45;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: 0 0 12px;
    }
    .summary-card {
      position: relative;
      min-width: 0;
      padding: 12px 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .summary-card::before {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 2px;
      background: var(--account-color, var(--accent));
      content: "";
    }
    .summary-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .account-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: var(--text-base);
      font-weight: 700;
    }
    .account-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--account-color, var(--accent));
      flex-shrink: 0;
    }
    .summary-status {
      color: var(--muted);
      font-size: var(--text-xs);
    }
    .summary-change {
      margin-bottom: 4px;
      color: var(--text);
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: var(--text-xl);
      font-weight: 700;
      line-height: 1.15;
    }
    .summary-change.is-positive { color: var(--ok-text); }
    .summary-change.is-negative { color: var(--bad-text); }
    .summary-equity {
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: var(--text-xs);
    }
    .summary-range {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
      color: var(--muted);
      font-size: var(--text-xs);
    }
    .summary-range strong {
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }
    .chart-panel {
      position: relative;
      min-height: 520px;
      padding: 14px 16px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .chart-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 10px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .chart-title {
      margin: 0;
      color: var(--text);
      font-size: var(--text-md);
      font-weight: 700;
    }
    .chart-subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: var(--text-xs);
      line-height: 1.5;
    }
    .chart-meta {
      color: var(--muted);
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: var(--text-xs);
      text-align: right;
      white-space: nowrap;
    }
    #equity-chart {
      width: 100%;
      height: 430px;
      border-radius: var(--radius-sm);
      background: var(--surface-inset);
    }
    .chart-empty {
      display: none;
      align-items: center;
      justify-content: center;
      height: 430px;
      border-radius: var(--radius-sm);
      background: var(--surface-inset);
      color: var(--muted);
      font-size: var(--text-sm);
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 32px;
      margin: 10px 0 0;
    }
    .legend-button {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 32px;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-secondary);
      background: var(--surface-subtle);
      cursor: pointer;
      font-size: var(--text-xs);
      font-weight: 700;
      transition: color 120ms ease, border-color 120ms ease, background 120ms ease;
    }
    .legend-button:hover {
      color: var(--text);
      border-color: var(--border-strong);
      background: var(--surface-hover);
    }
    .legend-button.is-muted {
      color: var(--muted);
      border-style: dashed;
      border-color: var(--border);
      background: var(--surface-inset);
      text-decoration: line-through;
    }
    .legend-button.is-muted .legend-swatch { opacity: 0.35; }
    .legend-button.is-muted .legend-value { color: var(--muted); }
    .legend-swatch {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--account-color);
      flex-shrink: 0;
    }
    .legend-value {
      color: var(--muted);
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: var(--text-xs);
      font-weight: 500;
    }
    .footnote {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px 20px;
      margin-top: 12px;
      color: var(--muted);
      font-size: var(--text-xs);
      line-height: 1.5;
    }
    .footnote strong {
      color: var(--text-secondary);
      font-weight: 600;
    }
    @media (max-width: 980px) {
      .hero { grid-template-columns: 1fr; gap: 12px; }
      .controls { justify-content: flex-start; }
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) {
      .page { padding: 10px 10px 24px; }
      .hero { padding: 12px; }
      .control { min-height: 36px; }
      .legend-button { min-height: 36px; }
      .summary-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
      .summary-card { padding: 10px 11px; }
      .summary-change { font-size: var(--text-lg); }
      .summary-range { flex-direction: column; gap: 2px; }
      .chart-panel { min-height: 490px; padding: 12px 10px 10px; }
      .chart-head { display: block; }
      .chart-meta { margin-top: 6px; text-align: left; }
      #equity-chart, .chart-empty { height: 360px; }
      .footnote { display: block; }
      .footnote span { display: block; }
    }
    @media (prefers-reduced-motion: reduce) {
      .control, .legend-button { transition: none; }
    }
  </style>
</head>
<body>
  <header class="ops-topbar">
    <div class="ops-topbar-inner">
      <a id="ops-nav-brand" class="ops-brand" href="../../"><span class="ops-brand-mark" aria-hidden="true"></span>Bubble Buster</a>
      <nav class="ops-nav" aria-label="主导航">
        <ul class="ops-nav-list">
          <li><a id="ops-nav-overview" class="ops-nav-link" href="../../">总览</a></li>
          <li><a id="ops-nav-comparison" class="ops-nav-link" href="./" aria-current="page">权益对比</a></li>
        </ul>
        <span id="ops-nav-divider" class="ops-nav-divider" aria-hidden="true" hidden></span>
        <ul id="ops-nav-accounts" class="ops-nav-list" aria-label="账户快速切换"></ul>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <div>
        <div class="hero-title-row">
          <h1>多账户权益走势同轴对比</h1>
          <div class="topline-status" role="status" aria-live="polite"><span id="status-dot" class="status-dot is-loading"></span><span id="status-text">正在读取快照</span></div>
        </div>
        <p class="hero-copy">基于统一时间轴与归一化基准（起点设为 0%），横向评估不同实盘策略的表现差异。</p>
      </div>
      <div class="controls" aria-label="图表筛选">
        <div id="range-controls" class="control-group" role="group" aria-label="时间范围">
          <button class="control" data-range="24" type="button" aria-pressed="false">24 小时</button>
          <button class="control" data-range="72" type="button" aria-pressed="false">3 天</button>
          <button class="control" data-range="168" type="button" aria-pressed="false">7 天</button>
          <button class="control" data-range="720" type="button" aria-pressed="false">30 天</button>
          <button class="control active" data-range="all" type="button" aria-pressed="true">上线以来</button>
        </div>
        <div id="mode-controls" class="control-group" role="group" aria-label="图表模式">
          <button class="control active" data-mode="relative" type="button" aria-pressed="true">相对变化</button>
          <button class="control" data-mode="absolute" type="button" aria-pressed="false">账户权益</button>
        </div>
        <button id="refresh-button" class="control refresh" type="button">刷新 ↻</button>
      </div>
    </section>

    <div id="notice" class="notice" role="alert"></div>
    <section id="summary-grid" class="summary-grid" aria-label="账户摘要"></section>

    <section class="chart-panel">
      <div class="chart-head">
        <div>
          <h2 id="chart-title" class="chart-title">相对权益变化（%）</h2>
          <p id="chart-subtitle" class="chart-subtitle">组合止盈上线后的首个有效快照 = 0%；策略事件不叠加到主图。</p>
        </div>
        <div id="chart-meta" class="chart-meta">--</div>
      </div>
      <div id="equity-chart" role="img" aria-label="四个账户权益对比曲线"></div>
      <div id="chart-empty" class="chart-empty">当前窗口没有可用权益快照</div>
      <div id="legend" class="legend" aria-label="账户图例"></div>
    </section>

    <div class="footnote">
      <span>数据来源：服务器 <strong>state.db / wallet_snapshots</strong>；按账户独立归一化。</span>
      <span id="data-as-of">数据截至 --</span>
    </div>
  </main>

  <script defer src="../../static/vendor/echarts.min.js"></script>
  <script defer src="../../static/ops.js?v=3"></script>
  <script>
  document.addEventListener("DOMContentLoaded", function () {
    "use strict";

    var COLORS = {
      acc01: "#58a6ff",
      acc02: "#f0883e",
      acc03: "#3fb950",
      acc04: "#e3b341"
    };
    var FALLBACK_COLORS = ["#58a6ff", "#f0883e", "#3fb950", "#e3b341", "#39c5cf", "#f778ba"];
    var chart = null;
    var payload = null;
    var VALID_RANGES = { "24": true, "72": true, "168": true, "720": true, "all": true };
    var VALID_MODES = { relative: true, absolute: true };
    var initialParams = window.BBOps ? window.BBOps.readQueryParams() : {};
    var range = VALID_RANGES[initialParams.range] ? initialParams.range : "all";
    var mode = VALID_MODES[initialParams.mode] ? initialParams.mode : "relative";
    var visible = {};
    if (initialParams.hide) {
      String(initialParams.hide).split(",").forEach(function (aid) {
        var trimmed = aid.trim();
        if (trimmed) visible[trimmed] = false;
      });
    }
    var activeAbortController = null;
    var activeRequestToken = 0;
    var lastLoadedAt = 0;
    var navAccountsHydrated = false;
    var currentPath = (window && window.location && window.location.pathname) || "/";
    var comparisonMarker = "/accounts/comparison";
    var comparisonMarkerIndex = currentPath.indexOf(comparisonMarker);
    var pathPrefix = comparisonMarkerIndex >= 0 ? currentPath.slice(0, comparisonMarkerIndex).replace(/\/+$/, "") : "";

    if (window.BBOps) {
      window.BBOps.initTopNav({ basePrefix: pathPrefix, activePage: "comparison" });
    }

    function el(id) { return document.getElementById(id); }

    function escapeHtml(value) {
      if (window.BBOps) return window.BBOps.escapeHtml(value);
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function colorFor(accountId, index) {
      return COLORS[accountId] || FALLBACK_COLORS[index % FALLBACK_COLORS.length];
    }

    function formatNumber(value, digits) {
      if (value == null || !Number.isFinite(Number(value))) return "--";
      return Number(value).toLocaleString("zh-CN", {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
      });
    }

    function formatPct(value) {
      if (window.BBOps) return window.BBOps.fmtPct(value);
      if (value == null || !Number.isFinite(Number(value))) return "--";
      var number = Number(value);
      return (number >= 0 ? "+" : "") + number.toFixed(2) + "%";
    }

    function formatLocalTime(value, withSeconds) {
      if (!value) return "--";
      var date = new Date(value);
      if (!Number.isFinite(date.getTime())) return String(value).replace("T", " ").slice(0, withSeconds ? 19 : 16);
      try {
        var options = {
          timeZone: "Asia/Shanghai",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        };
        if (withSeconds) options.second = "2-digit";
        return new Intl.DateTimeFormat("zh-CN", options).format(date).replace(/\//g, "-");
      } catch (error) {
        var beijingDate = new Date(date.getTime() + 8 * 60 * 60 * 1000);
        return beijingDate.toISOString().slice(0, withSeconds ? 19 : 16).replace("T", " ");
      }
    }

    function rangeLabel() {
      if (range === "all") return "上线以来";
      var hours = Number(range);
      if (hours < 48) return "最近 24 小时";
      if (hours < 168) return "最近 3 天";
      if (hours < 720) return "最近 7 天";
      return "最近 30 天";
    }

    function setStatus(text, state) {
      el("status-text").textContent = text;
      el("status-dot").className = "status-dot" + (state ? " is-" + state : "");
    }

    function seriesRows() {
      return (payload && payload.series) || [];
    }

    function loadNavAccounts() {
      if (!window.BBOps) return;
      fetch(pathPrefix + "/api/accounts/summary/fast?_=" + Date.now(), { cache: "no-store" })
        .then(function (response) {
          if (!response.ok) return null;
          return response.json();
        })
        .then(function (data) {
          if (!data || !Array.isArray(data.accounts) || !data.accounts.length) return;
          navAccountsHydrated = true;
          window.BBOps.renderNavAccounts(data.accounts);
        })
        .catch(function () {});
    }

    function renderSummary() {
      var target = el("summary-grid");
      target.innerHTML = seriesRows().map(function (row, index) {
        var color = colorFor(row.account_id, index);
        var change = row.change_pct;
        var changeClass = change == null ? "" : (Number(change) >= 0 ? "is-positive" : "is-negative");
        var status = row.status === "OK" ? "在线快照" : "暂无数据";
        return '<article class="summary-card" style="--account-color:' + color + '">' +
          '<div class="summary-head"><span class="account-label"><i class="account-dot" aria-hidden="true"></i>' + escapeHtml(row.account_id) + '</span><span class="summary-status">' + status + '</span></div>' +
          '<div class="summary-change ' + changeClass + '">' + formatPct(change) + '</div>' +
          '<div class="summary-equity">当前权益 ' + (row.latest_equity == null ? "--" : formatNumber(row.latest_equity, 2) + " USDT") + '</div>' +
          '<div class="summary-range"><span>区间低点 <strong>' + formatPct(row.min_change_pct) + '</strong></span><span>高点 <strong>' + formatPct(row.max_change_pct) + '</strong></span></div>' +
          '</article>';
      }).join("");
    }

    function renderLegend() {
      el("legend").innerHTML = seriesRows().map(function (row, index) {
        var muted = visible[row.account_id] === false;
        var color = colorFor(row.account_id, index);
        return '<button class="legend-button' + (muted ? " is-muted" : "") + '" data-account="' + escapeHtml(row.account_id) + '" aria-pressed="' + (!muted) + '" style="--account-color:' + color + '" type="button">' +
          '<i class="legend-swatch" aria-hidden="true"></i><span>' + escapeHtml(row.account_id) + '</span><span class="legend-value">' + formatPct(row.change_pct) + '</span></button>';
      }).join("");
    }

    function renderChart() {
      var rows = seriesRows();
      var chartElement = el("equity-chart");
      var emptyElement = el("chart-empty");
      var activeRows = rows.filter(function (row) {
        return row.status === "OK" && visible[row.account_id] !== false && (row.points || []).length;
      });
      chartElement.style.display = activeRows.length ? "block" : "none";
      emptyElement.style.display = activeRows.length ? "none" : "flex";
      el("chart-title").textContent = mode === "relative" ? "相对权益变化（%）" : "账户权益（USDT）";
      el("chart-subtitle").textContent = mode === "relative"
        ? (range === "all"
            ? "组合止盈上线后的首个有效快照 = 0%；策略事件不叠加到主图，避免跨账户时间差造成视觉干扰。"
            : "以所选时间区间（" + rangeLabel() + "）首个快照归一化（0%）；策略事件不叠加到主图。")
        : "显示服务器记录的权益快照；策略事件不叠加到主图。";
      if (typeof window.echarts === "undefined") {
        chartElement.style.display = "none";
        emptyElement.textContent = "图表组件加载失败";
        emptyElement.style.display = "flex";
        return;
      }
      if (!chart) chart = window.echarts.init(chartElement, null, { renderer: "canvas" });
      chartElement.setAttribute("aria-label", activeRows.length + " 个账户权益对比曲线");
      var chartSeries = activeRows.map(function (row, index) {
        var color = colorFor(row.account_id, index);
        var seriesPoints = [];
        (row.points || []).forEach(function (point) {
          var tMs = new Date(point.t).getTime();
          if (!Number.isFinite(tMs)) return;
          var yVal = mode === "relative" ? Number(point.relative_pct) : Number(point.equity);
          var eqVal = Number(point.equity);
          seriesPoints.push([tMs, Number.isFinite(yVal) ? yVal : null, Number.isFinite(eqVal) ? eqVal : null]);
        });
        return {
          name: row.account_id,
          type: "line",
          showSymbol: false,
          smooth: false,
          connectNulls: true,
          data: seriesPoints,
          lineStyle: { color: color, width: 2.2 },
          itemStyle: { color: color },
          emphasis: { focus: "series", lineStyle: { width: 3.2 } },
          markLine: index === 0 ? {
            silent: true,
            symbol: ["none", "none"],
            lineStyle: { color: "#484f58", type: "dashed", width: 1 },
            label: {
              position: "insideEndTop",
              distance: [8, 6],
              color: "#c9d1d9",
              backgroundColor: "rgba(13, 17, 23, 0.9)",
              borderColor: "#30363d",
              borderWidth: 1,
              borderRadius: 4,
              padding: [3, 7],
              fontSize: 12,
              formatter: range === "all" ? "上线后首个快照" : "区间初始基准"
            },
            data: mode === "relative" ? [{ yAxis: 0 }] : []
          } : undefined
        };
      });
      var reduceMotion = window.BBOps
        ? window.BBOps.prefersReducedMotion()
        : !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
      chart.setOption({
        animation: !reduceMotion,
        animationDuration: reduceMotion ? 0 : 400,
        animationEasing: "cubicOut",
        backgroundColor: "transparent",
        grid: { top: 32, right: 24, bottom: 48, left: 68 },
        tooltip: {
          trigger: "axis",
          axisPointer: { type: "line", lineStyle: { color: "#484f58" } },
          backgroundColor: "#161b22",
          borderColor: "#30363d",
          borderWidth: 1,
          textStyle: { color: "#f0f6fc", fontSize: 12 },
          formatter: function (items) {
            if (!items || !items.length) return "";
            var html = '<div style="margin-bottom:6px;color:#919ba6">' + escapeHtml(formatLocalTime(items[0].axisValue, true)) + '</div>';
            items.forEach(function (item) {
              var val = Array.isArray(item.value) ? item.value[1] : item.value;
              var equity = Array.isArray(item.value) ? item.value[2] : null;
              var suffix = mode === "relative" && equity != null ? " · " + formatNumber(equity, 2) + " USDT" : "";
              html += '<div style="line-height:1.6"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + escapeHtml(item.color) + ';margin-right:6px"></span>' + escapeHtml(item.seriesName) + ' <strong>' + (mode === "relative" ? formatPct(val) : formatNumber(val, 2) + " USDT") + '</strong>' + suffix + '</div>';
            });
            return html;
          }
        },
        xAxis: {
          type: "time",
          boundaryGap: false,
          axisLine: { lineStyle: { color: "#30363d" } },
          axisTick: { show: false },
          axisLabel: { color: "#919ba6", fontSize: 12, hideOverlap: true, formatter: function (value) { return formatLocalTime(value, false); } },
          splitLine: { show: true, lineStyle: { color: "rgba(48, 54, 61, 0.55)", type: "dashed" } }
        },
        yAxis: {
          type: "value",
          scale: mode === "absolute",
          axisLine: { show: false },
          axisTick: { show: false },
          axisLabel: { color: "#919ba6", fontSize: 12, formatter: function (value) { return mode === "relative" ? (value >= 0 ? "+" : "") + Number(value).toFixed(1) + "%" : Number(value).toFixed(0); } },
          splitLine: { lineStyle: { color: "rgba(48, 54, 61, 0.7)", type: "dashed" } }
        },
        series: chartSeries
      }, true);
      chart.resize();
    }

    function renderMeta() {
      var rows = seriesRows().filter(function (row) { return row.status === "OK" && row.points && row.points.length; });
      var count = rows.reduce(function (total, row) { return total + row.points.length; }, 0);
      var latest = rows.map(function (row) { return row.latest_at_utc; }).filter(Boolean).sort().slice(-1)[0];
      var comparisonStart = payload && payload.comparison_start_at_utc
        ? formatLocalTime(payload.comparison_start_at_utc, true)
        : "2026-08-10 09:32:10";
      el("chart-meta").textContent = rangeLabel() + " · " + rows.length + " 个账户 · " + count + " 个点";
      el("data-as-of").textContent = "组合止盈上线：" + comparisonStart + " · 数据截至 " + (latest ? formatLocalTime(latest, true) : "--") + "（北京时间）";
    }

    function render() {
      renderSummary();
      renderLegend();
      renderChart();
      renderMeta();
    }

    function setActiveControl(groupId, key, value) {
      Array.prototype.forEach.call(el(groupId).querySelectorAll(".control"), function (button) {
        var isActive = button.getAttribute("data-" + key) === value;
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-pressed", isActive ? "true" : "false");
      });
    }

    function ensureVisibility(rows) {
      rows.forEach(function (row) {
        if (visible[row.account_id] === undefined) visible[row.account_id] = true;
      });
    }

    function updateFreshnessStatus() {
      var rows = seriesRows().filter(function (row) { return row.status === "OK" && row.points && row.points.length; });
      if (!rows.length) {
        setStatus("当前窗口无快照", "loading");
        return;
      }
      var latest = rows.map(function (row) { return row.latest_at_utc; }).filter(Boolean).sort().slice(-1)[0];
      var latestMs = latest ? new Date(latest).getTime() : NaN;
      if (Number.isFinite(latestMs) && (Date.now() - latestMs) > 2 * 60 * 60 * 1000) {
        setStatus("历史快照（截至 " + formatLocalTime(latest, false) + "）", "loading");
        return;
      }
      setStatus("快照已更新", "");
    }

    function syncComparisonUrl() {
      if (!window.BBOps) return;
      var hiddenIds = Object.keys(visible).filter(function (aid) {
        return visible[aid] === false;
      }).sort();
      window.BBOps.updateQueryParams({
        range: range === "all" ? null : range,
        mode: mode === "relative" ? null : mode,
        hide: hiddenIds.length ? hiddenIds.join(",") : null
      });
    }

    function setRefreshBusy(busy) {
      var btn = el("refresh-button");
      if (!btn) return;
      btn.disabled = !!busy;
      btn.textContent = busy ? "刷新中..." : "刷新 ↻";
    }

    function load() {
      activeRequestToken += 1;
      var requestToken = activeRequestToken;
      if (activeAbortController) {
        try { activeAbortController.abort(); } catch (e) {}
      }
      activeAbortController = typeof AbortController !== "undefined" ? new AbortController() : null;
      setRefreshBusy(true);
      setStatus("正在读取快照", "loading");
      el("notice").style.display = "none";
      var query = range === "all" ? "all_time=true" : "window_hours=" + encodeURIComponent(range);
      fetch(pathPrefix + "/api/accounts/equity-comparison?" + query + "&curve_points=600&include_events=false&_=" + Date.now(), {
        cache: "no-store",
        signal: activeAbortController ? activeAbortController.signal : undefined
      })
        .then(function (response) {
          if (!response.ok) throw new Error("HTTP " + response.status);
          return response.json();
        })
        .then(function (nextPayload) {
          if (requestToken !== activeRequestToken) return;
          lastLoadedAt = Date.now();
          setRefreshBusy(false);
          payload = nextPayload || {};
          ensureVisibility(seriesRows());
          if (!navAccountsHydrated && window.BBOps) {
            window.BBOps.renderNavAccounts(seriesRows());
          }
          render();
          updateFreshnessStatus();
        })
        .catch(function (error) {
          if (requestToken !== activeRequestToken) return;
          if (error && error.name === "AbortError") return;
          setRefreshBusy(false);
          setStatus("读取失败", "error");
          el("notice").textContent = "账户对比数据读取失败：" + (error && error.message ? error.message : "网络异常");
          el("notice").style.display = "block";
        });
    }

    setActiveControl("range-controls", "range", range);
    setActiveControl("mode-controls", "mode", mode);

    Array.prototype.forEach.call(document.querySelectorAll("[data-range]"), function (button) {
      button.addEventListener("click", function () {
        range = button.getAttribute("data-range") || "168";
        setActiveControl("range-controls", "range", range);
        syncComparisonUrl();
        load();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-mode]"), function (button) {
      button.addEventListener("click", function () {
        mode = button.getAttribute("data-mode") || "relative";
        setActiveControl("mode-controls", "mode", mode);
        syncComparisonUrl();
        if (payload) render();
      });
    });
    el("refresh-button").addEventListener("click", load);
    el("legend").addEventListener("click", function (event) {
      var button = event.target.closest("[data-account]");
      if (!button) return;
      var accountId = button.getAttribute("data-account");
      visible[accountId] = visible[accountId] === false;
      syncComparisonUrl();
      renderLegend();
      renderChart();
    });
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden && (Date.now() - lastLoadedAt) >= 30000) {
        load();
      }
    });
    if (typeof ResizeObserver !== "undefined") {
      var chartContainer = el("equity-chart");
      if (chartContainer) {
        var resizeObserver = new ResizeObserver(function () {
          if (chart) chart.resize();
        });
        resizeObserver.observe(chartContainer);
      }
    } else {
      window.addEventListener("resize", function () { if (chart) chart.resize(); });
    }
    loadNavAccounts();
    load();
  });
  </script>
</body>
</html>
