<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>账户权益对比 · Bubble Buster</title>
  <style>
    :root {
      --bg: #071019;
      --bg-deep: #050a0f;
      --panel: #0c1822;
      --panel-raised: #10212c;
      --line: #24485d;
      --line-soft: rgba(72, 124, 151, 0.25);
      --text: #edf7fd;
      --muted: #7f9eaf;
      --faint: #527184;
      --accent: #4ec1ff;
      --good: #26d07c;
      --warn: #ffb340;
      --bad: #ff7070;
      --acc01: #3da8ff;
      --acc02: #f08a36;
      --acc03: #38b9aa;
      --acc04: #9c65d8;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg-deep); }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 0%, rgba(32, 104, 139, 0.18), transparent 34%),
        radial-gradient(circle at 94% 10%, rgba(122, 73, 163, 0.12), transparent 28%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
      font-family: "Avenir Next", "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
      letter-spacing: 0;
    }
    button, a { font: inherit; }
    a { color: inherit; }
    .page {
      width: min(1480px, calc(100% - 34px));
      margin: 0 auto;
      padding: 18px 0 34px;
    }
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      color: var(--muted);
      font-size: 12px;
    }
    .crumbs {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }
    .crumbs a {
      color: #b8d8e8;
      text-decoration: none;
    }
    .crumbs a:hover { color: var(--accent); }
    .crumb-sep { color: #42677b; }
    .topline-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--good);
      box-shadow: 0 0 0 4px rgba(38, 208, 124, 0.1);
    }
    .status-dot.is-loading { background: var(--warn); box-shadow: 0 0 0 4px rgba(255, 179, 64, 0.1); }
    .status-dot.is-error { background: var(--bad); box-shadow: 0 0 0 4px rgba(255, 112, 112, 0.1); }
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 28px;
      margin-bottom: 18px;
    }
    .eyebrow {
      margin: 0 0 9px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 820px;
      margin: 0;
      color: #f4faff;
      font-family: "Avenir Next", "PingFang SC", sans-serif;
      font-size: clamp(28px, 4vw, 52px);
      font-weight: 700;
      letter-spacing: -0.045em;
      line-height: 1.05;
    }
    .hero-copy {
      max-width: 720px;
      margin: 12px 0 0;
      color: #96b2c1;
      font-size: 14px;
      line-height: 1.7;
    }
    .hero-copy strong { color: #d9edf7; font-weight: 700; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }
    .control-group {
      display: inline-flex;
      gap: 2px;
      padding: 3px;
      border: 1px solid #214459;
      border-radius: 7px;
      background: rgba(9, 22, 32, 0.82);
    }
    .control {
      appearance: none;
      border: 0;
      border-radius: 4px;
      padding: 7px 10px;
      color: #87a8b9;
      background: transparent;
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
      transition: color 140ms ease, background 140ms ease, transform 140ms ease;
    }
    .control:hover { color: #e8f7ff; }
    .control:active { transform: translateY(1px); }
    .control.active {
      color: #f0faff;
      background: #17374a;
      box-shadow: 0 0 0 1px rgba(78, 193, 255, 0.2) inset;
    }
    .control.refresh {
      border: 1px solid #2c5b71;
      color: #c7e5f2;
      background: #102736;
    }
    .control.refresh:hover { border-color: var(--accent); background: #173d52; }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 22px 0 14px;
    }
    .summary-card {
      position: relative;
      min-width: 0;
      padding: 14px 15px 13px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: linear-gradient(150deg, rgba(16, 34, 47, 0.96), rgba(9, 20, 29, 0.96));
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.16);
    }
    .summary-card::before {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 2px;
      background: var(--account-color, var(--accent));
      content: "";
    }
    .summary-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .account-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #d8eaf4;
      font-size: 13px;
      font-weight: 800;
    }
    .account-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--account-color, var(--accent));
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--account-color, var(--accent)) 12%, transparent);
    }
    .summary-status { color: var(--muted); font-size: 10px; }
    .summary-change {
      margin-bottom: 4px;
      color: #f2f9fd;
      font-family: ui-monospace, Menlo, Monaco, Consolas, monospace;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -0.04em;
    }
    .summary-change.is-positive { color: var(--good); }
    .summary-change.is-negative { color: var(--bad); }
    .summary-equity { color: #9cb8c7; font-family: ui-monospace, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
    .summary-range {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
      padding-top: 9px;
      border-top: 1px solid rgba(55, 101, 127, 0.32);
      color: var(--muted);
      font-size: 10px;
    }
    .summary-range strong { color: #c7dce7; font-family: ui-monospace, Menlo, Monaco, Consolas, monospace; font-weight: 600; }
    .chart-panel {
      position: relative;
      min-height: 585px;
      padding: 17px 18px 14px;
      border: 1px solid #28526a;
      border-radius: 14px;
      background:
        linear-gradient(180deg, rgba(14, 31, 43, 0.9), rgba(8, 17, 25, 0.98)),
        repeating-linear-gradient(90deg, transparent 0, transparent 79px, rgba(89, 143, 168, 0.04) 80px);
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.2);
    }
    .chart-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 5px;
    }
    .chart-title { margin: 0; color: #e9f6fc; font-size: 15px; font-weight: 800; }
    .chart-subtitle { margin: 5px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .chart-meta { color: #66879a; font-size: 10px; text-align: right; white-space: nowrap; }
    #equity-chart { width: 100%; height: 470px; }
    .chart-empty {
      display: none;
      align-items: center;
      justify-content: center;
      height: 470px;
      color: var(--muted);
      font-size: 13px;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      min-height: 29px;
      margin: 4px 0 0;
    }
    .legend-button {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 27px;
      padding: 4px 9px;
      border: 1px solid #2a5268;
      border-radius: 5px;
      color: #c0d5df;
      background: rgba(9, 22, 31, 0.76);
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
      transition: opacity 140ms ease, border-color 140ms ease, background 140ms ease;
    }
    .legend-button:hover { border-color: #5b8ba1; }
    .legend-button.is-muted { opacity: 0.42; }
    .legend-swatch { width: 8px; height: 8px; border-radius: 50%; background: var(--account-color); }
    .legend-value { color: #91adbb; font-family: ui-monospace, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 500; }
    .events-panel {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 16px;
      align-items: start;
      margin-top: 14px;
      padding: 14px 16px;
      border: 1px solid #24485d;
      border-radius: 11px;
      background: rgba(11, 25, 35, 0.72);
    }
    .events-label { color: #8eabba; font-size: 11px; font-weight: 800; padding-top: 4px; }
    .events-list { display: flex; flex-wrap: wrap; gap: 7px; min-height: 23px; }
    .event-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 8px;
      border: 1px solid #34566a;
      border-radius: 4px;
      color: #bfd4df;
      background: #102431;
      font-size: 10px;
    }
    .event-chip strong { color: #f1f8fb; font-weight: 800; }
    .event-chip .event-kind { color: #d0e5ee; }
    .event-chip.is-retry {
      border-color: rgba(255, 179, 64, 0.52);
      background: rgba(59, 42, 22, 0.74);
    }
    .event-chip.is-retry .event-kind { color: #ffc875; }
    .event-empty { color: #688596; font-size: 11px; padding-top: 4px; }
    .footnote {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px 20px;
      margin-top: 12px;
      color: #698899;
      font-size: 10px;
      line-height: 1.6;
    }
    .footnote strong { color: #aac5d2; font-weight: 600; }
    .notice {
      display: none;
      margin: 0 0 14px;
      padding: 10px 12px;
      border: 1px solid #714347;
      border-radius: 8px;
      color: #ffb0b0;
      background: rgba(70, 24, 29, 0.38);
      font-size: 11px;
    }
    @media (max-width: 980px) {
      .hero { grid-template-columns: 1fr; gap: 16px; }
      .controls { justify-content: flex-start; }
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 640px) {
      .page { width: min(100% - 20px, 1480px); padding-top: 12px; }
      .topline { margin-bottom: 18px; }
      .topline-status { display: none; }
      h1 { font-size: 34px; }
      .hero-copy { font-size: 13px; }
      .summary-grid { grid-template-columns: 1fr 1fr; gap: 7px; }
      .summary-card { padding: 12px 11px; }
      .summary-change { font-size: 20px; }
      .summary-equity { font-size: 10px; }
      .chart-panel { min-height: 515px; padding: 13px 10px 10px; border-radius: 10px; }
      .chart-head { display: block; }
      .chart-meta { margin-top: 7px; text-align: left; }
      #equity-chart, .chart-empty { height: 375px; }
      .events-panel { grid-template-columns: 1fr; gap: 7px; padding: 11px; }
      .footnote { display: block; }
      .footnote span { display: block; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topline">
      <div class="crumbs">
        <a href="../../">← 账户总览</a>
        <span class="crumb-sep">/</span>
        <span>账户权益对比</span>
      </div>
      <div class="topline-status"><span id="status-dot" class="status-dot is-loading"></span><span id="status-text">正在读取快照</span></div>
    </div>

    <section class="hero">
      <div>
        <p class="eyebrow">ACCOUNT / EQUITY / RELATIVE VIEW</p>
        <h1>四账户权益，放在同一条时间线上。</h1>
        <p class="hero-copy">数据从组合止盈正式上线时刻开始；每个账户在这个范围内的<strong>首个有效权益快照归一化为 0%</strong>，曲线只回答一个问题：组合上线以后，谁在持续积累，谁在回吐。</p>
      </div>
      <div class="controls" aria-label="图表筛选">
        <div id="range-controls" class="control-group" role="group" aria-label="时间范围">
          <button class="control" data-range="24" type="button">24 小时</button>
          <button class="control" data-range="72" type="button">3 天</button>
          <button class="control" data-range="168" type="button">7 天</button>
          <button class="control" data-range="720" type="button">30 天</button>
          <button class="control active" data-range="all" type="button">上线以来</button>
        </div>
        <div id="mode-controls" class="control-group" role="group" aria-label="图表模式">
          <button class="control active" data-mode="relative" type="button">相对变化</button>
          <button class="control" data-mode="absolute" type="button">账户权益</button>
        </div>
        <button id="refresh-button" class="control refresh" type="button">刷新 ↻</button>
      </div>
    </section>

    <div id="notice" class="notice" role="alert"></div>
    <section id="summary-grid" class="summary-grid" aria-label="账户摘要"></section>

    <section class="chart-panel">
      <div class="chart-head">
        <div>
          <h2 id="chart-title" class="chart-title">相对权益变化（%）</h2>
          <p id="chart-subtitle" class="chart-subtitle">组合止盈上线后的首个有效快照 = 0%；悬停查看每个账户的绝对权益。</p>
        </div>
        <div id="chart-meta" class="chart-meta">--</div>
      </div>
      <div id="equity-chart" role="img" aria-label="四个账户权益对比曲线"></div>
      <div id="chart-empty" class="chart-empty">当前窗口没有可用权益快照</div>
      <div id="legend" class="legend" aria-label="账户图例"></div>
    </section>

    <section class="events-panel">
      <div class="events-label">策略节点</div>
      <div id="events-list" class="events-list"></div>
    </section>

    <div class="footnote">
      <span>数据来源：服务器 <strong>state.db / wallet_snapshots</strong>；按账户独立归一化。</span>
      <span id="data-as-of">数据截至 --</span>
    </div>
  </main>

  <script src="../../static/vendor/echarts.min.js"></script>
  <script>
  (function () {
    "use strict";

    var COLORS = {
      acc01: "#3da8ff",
      acc02: "#f08a36",
      acc03: "#38b9aa",
      acc04: "#9c65d8"
    };
    var FALLBACK_COLORS = ["#3da8ff", "#f08a36", "#38b9aa", "#9c65d8", "#ffca65", "#e783a9"];
    var chart = null;
    var payload = null;
    var range = "all";
    var mode = "relative";
    var visible = {};
    var loading = false;
    var currentPath = (window && window.location && window.location.pathname) || "/";
    var comparisonMarker = "/accounts/comparison";
    var comparisonMarkerIndex = currentPath.indexOf(comparisonMarker);
    var pathPrefix = comparisonMarkerIndex >= 0 ? currentPath.slice(0, comparisonMarkerIndex).replace(/\/+$/, "") : "";

    function el(id) { return document.getElementById(id); }

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function colorFor(accountId, index) {
      return COLORS[accountId] || FALLBACK_COLORS[index % FALLBACK_COLORS.length];
    }

    function formatNumber(value, digits) {
      if (value == null || !Number.isFinite(Number(value))) return "--";
      return Number(value).toLocaleString("zh-CN", {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
      });
    }

    function formatPct(value) {
      if (value == null || !Number.isFinite(Number(value))) return "--";
      var number = Number(value);
      return (number >= 0 ? "+" : "") + number.toFixed(2) + "%";
    }

    function formatLocalTime(value, withSeconds) {
      if (!value) return "--";
      var date = new Date(value);
      if (!Number.isFinite(date.getTime())) return String(value).replace("T", " ").slice(0, withSeconds ? 19 : 16);
      try {
        return new Intl.DateTimeFormat("zh-CN", {
          timeZone: "Asia/Shanghai",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: !!withSeconds,
          hour12: false
        }).format(date).replace(/\//g, "-");
      } catch (error) {
        return date.toISOString().slice(0, withSeconds ? 19 : 16).replace("T", " ");
      }
    }

    function rangeLabel() {
      if (range === "all") return "上线以来";
      var hours = Number(range);
      if (hours < 48) return "最近 24 小时";
      if (hours < 168) return "最近 3 天";
      if (hours < 720) return "最近 7 天";
      return "最近 30 天";
    }

    function setStatus(text, state) {
      el("status-text").textContent = text;
      el("status-dot").className = "status-dot" + (state ? " is-" + state : "");
    }

    function seriesRows() {
      return (payload && payload.series) || [];
    }

    function renderSummary() {
      var target = el("summary-grid");
      target.innerHTML = seriesRows().map(function (row, index) {
        var color = colorFor(row.account_id, index);
        var change = row.change_pct;
        var changeClass = change == null ? "" : (Number(change) >= 0 ? "is-positive" : "is-negative");
        var status = row.status === "OK" ? "在线快照" : "暂无数据";
        return '<article class="summary-card" style="--account-color:' + color + '">' +
          '<div class="summary-head"><span class="account-label"><i class="account-dot"></i>' + escapeHtml(row.account_id) + '</span><span class="summary-status">' + status + '</span></div>' +
          '<div class="summary-change ' + changeClass + '">' + formatPct(change) + '</div>' +
          '<div class="summary-equity">当前权益 ' + (row.latest_equity == null ? "--" : formatNumber(row.latest_equity, 2) + " USDT") + '</div>' +
          '<div class="summary-range"><span>区间低点 <strong>' + formatPct(row.min_change_pct) + '</strong></span><span>高点 <strong>' + formatPct(row.max_change_pct) + '</strong></span></div>' +
          '</article>';
      }).join("");
    }

    function renderLegend() {
      el("legend").innerHTML = seriesRows().map(function (row, index) {
        var muted = visible[row.account_id] === false;
        var color = colorFor(row.account_id, index);
        return '<button class="legend-button' + (muted ? " is-muted" : "") + '" data-account="' + escapeHtml(row.account_id) + '" aria-pressed="' + (!muted) + '" style="--account-color:' + color + '" type="button">' +
          '<i class="legend-swatch"></i><span>' + escapeHtml(row.account_id) + '</span><span class="legend-value">' + formatPct(row.change_pct) + '</span></button>';
      }).join("");
    }

    function renderEvents() {
      var events = (payload && payload.events) || [];
      if (!events.length) {
        el("events-list").innerHTML = '<span class="event-empty">当前范围未捕获到组合止盈触发日志；图中虚线 0% 代表各账户上线后的首个快照。</span>';
        return;
      }
      el("events-list").innerHTML = events.map(function (event) {
        var isRetry = String(event.status || "").toUpperCase() === "TRIGGERED_RETRY";
        var eventLabel = event.label || (isRetry ? "组合止盈重试" : "组合止盈首次触发");
        var detail = event.actual_profit_pct == null ? "" : " · 触发时 +" + Number(event.actual_profit_pct).toFixed(2) + "%";
        return '<span class="event-chip' + (isRetry ? " is-retry" : "") + '"><strong>' + escapeHtml(event.account_id) + '</strong><span class="event-kind">' + escapeHtml(eventLabel) + '</span><span>' + formatLocalTime(event.t_utc, true) + detail + '</span></span>';
      }).join("");
    }

    function renderChart() {
      var rows = seriesRows();
      var chartElement = el("equity-chart");
      var emptyElement = el("chart-empty");
      var activeRows = rows.filter(function (row) {
        return row.status === "OK" && visible[row.account_id] !== false && (row.points || []).length;
      });
      chartElement.style.display = activeRows.length ? "block" : "none";
      emptyElement.style.display = activeRows.length ? "none" : "flex";
      el("chart-title").textContent = mode === "relative" ? "相对权益变化（%）" : "账户权益（USDT）";
      el("chart-subtitle").textContent = mode === "relative"
        ? "组合止盈上线后的首个有效快照 = 0%；竖线表示组合止盈事件，首次触发/重试见下方节点。"
        : "显示服务器记录的权益快照；竖线表示组合止盈事件，悬停查看相对变化。";
      if (!chart) chart = echarts.init(chartElement, null, { renderer: "canvas" });
      var chartSeries = activeRows.map(function (row, index) {
        var color = colorFor(row.account_id, index);
        return {
          name: row.account_id,
          type: "line",
          showSymbol: false,
          smooth: false,
          connectNulls: true,
          data: (row.points || []).map(function (point) {
            return [point.t, mode === "relative" ? point.relative_pct : point.equity];
          }),
          lineStyle: { color: color, width: 2.5 },
          itemStyle: { color: color },
          emphasis: { focus: "series", lineStyle: { width: 3.5 } },
          markLine: index === 0 ? {
            silent: true,
            symbol: ["none", "none"],
            lineStyle: { color: "rgba(164, 197, 211, 0.42)", type: "dashed", width: 1 },
            label: { color: "#9fb8c5", fontSize: 10, formatter: "上线后首个快照" },
            data: mode === "relative" ? [{ yAxis: 0 }] : []
          } : undefined
        };
      });
      var eventGroups = [];
      ((payload && payload.events) || []).slice().sort(function (left, right) {
        return new Date(left.t_utc).getTime() - new Date(right.t_utc).getTime();
      }).forEach(function (event) {
        var eventMs = new Date(event.t_utc).getTime();
        var previous = eventGroups[eventGroups.length - 1];
        var isSameMoment = previous && Number.isFinite(eventMs) && Number.isFinite(previous.timeMs)
          && Math.abs(eventMs - previous.timeMs) <= 5000;
        if (!isSameMoment) {
          previous = { time: event.t_utc, timeMs: eventMs, events: [] };
          eventGroups.push(previous);
        }
        previous.events.push(event);
      });
      var eventLines = eventGroups.map(function (group, index) {
        return {
          xAxis: group.time,
          name: "组合止盈事件",
          lineStyle: { color: "rgba(255, 179, 64, 0.72)", type: "dashed", width: 1 },
          label: index === eventGroups.length - 1
            ? {
                show: true,
                formatter: "组合止盈事件",
                position: "insideEndTop",
                rotate: 0,
                color: "#ffd38a",
                fontSize: 10,
                backgroundColor: "rgba(7, 16, 25, 0.9)",
                padding: [3, 5],
                borderRadius: 3
              }
            : { show: false }
        };
      });
      if (chartSeries.length && eventLines.length) {
        chartSeries[0].markLine = chartSeries[0].markLine || { data: [] };
        chartSeries[0].markLine.data = (chartSeries[0].markLine.data || []).concat(eventLines);
      }
      chart.setOption({
        animationDuration: 480,
        animationEasing: "cubicOut",
        backgroundColor: "transparent",
        grid: { top: 30, right: 22, bottom: 48, left: 66 },
        tooltip: {
          trigger: "axis",
          axisPointer: { type: "line", lineStyle: { color: "rgba(197, 226, 237, 0.3)" } },
          backgroundColor: "rgba(5, 14, 21, 0.96)",
          borderColor: "#315d73",
          borderWidth: 1,
          textStyle: { color: "#edf7fd", fontSize: 11 },
          formatter: function (items) {
            if (!items || !items.length) return "";
            var html = '<div style="margin-bottom:5px;color:#9eb9c6">' + formatLocalTime(items[0].axisValue, true) + '</div>';
            items.forEach(function (item) {
              var row = rows.find(function (candidate) { return candidate.account_id === item.seriesName; });
              var point = row && (row.points || []).reduce(function (closest, candidate) {
                if (!closest) return candidate;
                return Math.abs(new Date(candidate.t).getTime() - new Date(item.axisValue).getTime()) < Math.abs(new Date(closest.t).getTime() - new Date(item.axisValue).getTime()) ? candidate : closest;
              }, null);
              var suffix = point && mode === "relative" ? " · " + formatNumber(point.equity, 2) + " USDT" : "";
              html += '<div><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + item.color + ';margin-right:6px"></span>' + escapeHtml(item.seriesName) + ' <strong>' + (mode === "relative" ? formatPct(item.value) : formatNumber(item.value, 2) + " USDT") + '</strong>' + suffix + '</div>';
            });
            return html;
          }
        },
        xAxis: {
          type: "time",
          boundaryGap: false,
          axisLine: { lineStyle: { color: "#31576b" } },
          axisTick: { show: false },
          axisLabel: { color: "#7796a6", fontSize: 10, hideOverlap: true, formatter: function (value) { return formatLocalTime(value, false); } },
          splitLine: { show: true, lineStyle: { color: "rgba(95, 145, 166, 0.12)", type: "dashed" } }
        },
        yAxis: {
          type: "value",
          scale: mode === "absolute",
          axisLine: { show: false },
          axisTick: { show: false },
          axisLabel: { color: "#7796a6", fontSize: 10, formatter: function (value) { return mode === "relative" ? (value >= 0 ? "+" : "") + Number(value).toFixed(1) + "%" : Number(value).toFixed(0); } },
          splitLine: { lineStyle: { color: "rgba(95, 145, 166, 0.16)", type: "dashed" } }
        },
        series: chartSeries
      }, true);
      chart.resize();
    }

    function renderMeta() {
      var rows = seriesRows().filter(function (row) { return row.status === "OK" && row.points && row.points.length; });
      var count = rows.reduce(function (total, row) { return total + row.points.length; }, 0);
      var latest = rows.map(function (row) { return row.latest_at_utc; }).filter(Boolean).sort().slice(-1)[0];
      var comparisonStart = payload && payload.comparison_start_at_utc
        ? formatLocalTime(payload.comparison_start_at_utc, true)
        : "2026-08-10 09:32:10";
      el("chart-meta").textContent = rangeLabel() + " · " + rows.length + " 个账户 · " + count + " 个点";
      el("data-as-of").textContent = "组合止盈上线：" + comparisonStart + " · 数据截至 " + (latest ? formatLocalTime(latest, true) : "--") + "（北京时间）";
    }

    function render() {
      renderSummary();
      renderLegend();
      renderChart();
      renderEvents();
      renderMeta();
    }

    function setActiveControl(groupId, key, value) {
      Array.prototype.forEach.call(el(groupId).querySelectorAll(".control"), function (button) {
        button.classList.toggle("active", button.getAttribute("data-" + key) === value);
      });
    }

    function ensureVisibility(rows) {
      rows.forEach(function (row) {
        if (visible[row.account_id] === undefined) visible[row.account_id] = true;
      });
    }

    function load() {
      if (loading) return;
      loading = true;
      setStatus("正在读取快照", "loading");
      el("notice").style.display = "none";
      var query = range === "all" ? "all_time=true" : "window_hours=" + encodeURIComponent(range);
      fetch(pathPrefix + "/api/accounts/equity-comparison?" + query + "&curve_points=600&_=" + Date.now(), { cache: "no-store" })
        .then(function (response) {
          if (!response.ok) throw new Error("HTTP " + response.status);
          return response.json();
        })
        .then(function (nextPayload) {
          payload = nextPayload || {};
          ensureVisibility(seriesRows());
          render();
          setStatus("快照已更新", "");
        })
        .catch(function (error) {
          setStatus("读取失败", "error");
          el("notice").textContent = "账户对比数据读取失败：" + error.message;
          el("notice").style.display = "block";
        })
        .finally(function () { loading = false; });
    }

    Array.prototype.forEach.call(document.querySelectorAll("[data-range]"), function (button) {
      button.addEventListener("click", function () {
        range = button.getAttribute("data-range") || "168";
        setActiveControl("range-controls", "range", range);
        load();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-mode]"), function (button) {
      button.addEventListener("click", function () {
        mode = button.getAttribute("data-mode") || "relative";
        setActiveControl("mode-controls", "mode", mode);
        if (payload) render();
      });
    });
    el("refresh-button").addEventListener("click", load);
    el("legend").addEventListener("click", function (event) {
      var button = event.target.closest("[data-account]");
      if (!button) return;
      var accountId = button.getAttribute("data-account");
      visible[accountId] = visible[accountId] === false;
      renderLegend();
      renderChart();
    });
    window.addEventListener("resize", function () { if (chart) chart.resize(); });
    load();
  }());
  </script>
</body>
</html>
